<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>design</title>
<link rel="stylesheet" href="fonts/fonts.css">
<!--
  Ponto de partida do desenho do vídeo. Regras (o gerador tools/gen-template.mjs depende delas):
  - Palco fixo de 1280x720 em #stage; o Hypit escala para 1920x1080.
  - Mantenha EXATAMENTE os trechos ":root{", a regra "html,body{...}" abaixo,
    "const TLd=window.TL, S={};", "window.renderAt=function(t){" e "window.READY=document.fonts.ready.then(()=>true);".
  - Uma camada por cena: <div class="layer" id="L-<cena>">, com o id igual ao da cena no script.py.
  - renderAt(t) recebe segundos e precisa desenhar o estado completo daquele instante (sem depender do quadro anterior).
  - Tempo vem de window.TL: S.<cena>.start/end e sen('<cena>',i).start/end; wordT() estima quando uma palavra é dita.
  - Cores sempre pelas constantes C (uma cor fixa por componente do assunto). Sem imagens externas.
  - Para testar: node <skill>/scripts/stills.js design.html <timeline.json> folha.png 2 8 15 ...
    (este arquivo precisa estar ao lado da pasta fonts/ para os testes).
-->
<style>
:root{
  --bg:#0c1018; --panel:#151b27; --ink:#eef2f8; --muted:#8f9bb3; --line:#283247;
  --a:#ff8a5c; --b:#6f9bff; --c:#b98cff; --d:#3fd3bb; --warn:#ff5d6c;
  --display:"Archivo","Arial Narrow",sans-serif; --body:"Source Sans 3","Liberation Sans",sans-serif; --mono:"JetBrains Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body)}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;
  background:radial-gradient(1100px 650px at 72% 38%, #131a28 0%, var(--bg) 62%)}
.layer{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.kicker{position:absolute;left:64px;top:44px;font-family:var(--mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kicker b{color:var(--b);font-weight:500}
.h1{font-family:var(--display);font-weight:800;font-stretch:118%;font-size:76px;line-height:1.02;letter-spacing:-.01em}
.h1 em{font-style:normal;color:var(--b)}
.h2{font-family:var(--display);font-weight:800;font-stretch:115%;font-size:48px;line-height:1.05}
.lead{font-size:26px;color:var(--muted);line-height:1.35}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}
svg text{font-family:var(--body)}
#sub{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1060px;width:max-content;
  font-size:29px;line-height:1.3;font-weight:600;text-align:center;color:var(--ink);
  background:rgba(5,8,13,.8);padding:10px 24px;border-radius:12px;opacity:0;text-wrap:balance}
#prog{position:absolute;left:0;bottom:0;height:5px;background:var(--b);width:0}
#progbg{position:absolute;left:0;right:0;bottom:0;height:5px;background:#18202e}
</style>
</head>
<body>
<div id="stage">

  <!-- Exemplo: cena "abertura". Copie o padrão para cada cena do script.py. -->
  <div class="layer" id="L-abertura">
    <div class="abs" id="openText" style="left:72px;top:200px;width:620px">
      <div class="kicker" style="position:static;margin-bottom:22px">Como funciona</div>
      <div class="h1">Título da <em>explicação</em></div>
      <p class="lead" style="margin-top:26px;max-width:540px">Uma frase de apoio.</p>
    </div>
    <svg class="abs" id="hero" style="left:760px;top:90px;width:440px;height:440px" viewBox="0 0 440 440"></svg>
  </div>

  <!-- Áreas fixas: legenda (ocupa de y≈590 até a borda) e barra de progresso. Não desenhe nada importante abaixo de y=570. -->
  <div id="sub"></div>
  <div id="progbg"></div><div id="prog"></div>
</div>

<script>
const C={bg:'#0c1018',panel:'#151b27',ink:'#eef2f8',muted:'#8f9bb3',line:'#283247',a:'#ff8a5c',b:'#6f9bff',c:'#b98cff',d:'#3fd3bb',warn:'#ff5d6c',dim:'#1b2332'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const smooth=u=>{u=clamp(u);return u*u*(3-2*u)};
const frac=x=>x-Math.floor(x);
const fade=(t,a,b,f=.35)=>clamp((t-a)/f)*clamp((b-t)/f);
function kf(t,keys,ease=smooth){ // [[t0,v0],[t1,v1],...]
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){const[t1,v1]=keys[i],[t0,v0]=keys[i-1];if(t<=t1)return lerp(v0,v1,ease((t-t0)/Math.max(1e-6,t1-t0)))}
  return keys[keys.length-1][1];
}
const $=id=>document.getElementById(id);
const TLd=window.TL, S={};for(const s of TLd.scenes)S[s.id]=s;
const sen=(id,i)=>S[id].sentences[i];
function wordT(id,i,word,lag=.15){const s=sen(id,i),k=s.text.toLowerCase().indexOf(word.toLowerCase());return s.start+(k<0?0:k/s.text.length)*(s.end-s.start)+lag}
function setLayer(id,a){const el=$('L-'+id);if(!el)return;el.style.opacity=a.toFixed(3);el.style.visibility=a>0.001?'visible':'hidden'}
const appear=(el,t,at,dy=16,d=.45)=>{const u=smooth((t-at)/d);el.style.opacity=u.toFixed(3);el.style.transform=`translateY(${((1-u)*dy).toFixed(1)}px)`;return u};

// Construa aqui os desenhos estáticos de cada cena (SVG via innerHTML), uma vez.
(function(){
  let h=`<rect x="70" y="70" width="300" height="300" rx="22" fill="${C.panel}" stroke="${C.line}" stroke-width="3"/>`;
  for(let i=0;i<6;i++)h+=`<rect class="bar" x="${100+i*42}" y="120" width="28" height="200" rx="6" fill="${C.b}"/>`;
  $('hero').innerHTML=h;
})();
const bars=[...document.querySelectorAll('#hero .bar')];

window.renderAt=function(t){
  // Uma seção por cena, sempre protegida por if(S.<cena>).
  if(S.abertura){const sc=S.abertura,a=fade(t,-1,sc.end,.45);setLayer('abertura',a);
    if(a>0){appear($('openText'),t,.15,26,.9);
      bars.forEach((el,i)=>el.setAttribute('opacity',(.3+.7*Math.max(0,Math.sin(t*4-i*.6))).toFixed(2)));}}

  // legendas e progresso (não mexa)
  let cur=null;for(const sc of TLd.scenes)for(const s of sc.sentences)if(t>=s.start-.12&&t<=s.end+.3)cur=s;
  const sub=$('sub');
  if(cur){if(sub.textContent!==cur.text)sub.textContent=cur.text;sub.style.opacity=(clamp((t-cur.start+.12)/.15)*clamp((cur.end+.3-t)/.15)).toFixed(3)}
  else sub.style.opacity=0;
  $('prog').style.width=(t/TLd.total*100)+'%';
};
window.READY=document.fonts.ready.then(()=>true);
</script>
</body>
</html>
